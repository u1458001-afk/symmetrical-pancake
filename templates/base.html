<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d35">
  <title>{% block title %}聯大學分規劃{% endblock %}｜國立聯合大學</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="聯大學分規劃首頁"><span class="brand-mark">聯</span><span><strong>聯大學分規劃</strong><small>國立聯合大學・學生自我檢核工具</small></span></a>

  <footer class="site-footer"><strong>校務核對提醒</strong><p>本工具所有結果均為「依目前輸入門檻、修課紀錄與課程池推算」，不代表校方正式審核或最新開課資訊。畢業學分、課程認列、抵免、擋修及開課狀況，請以聯大教務處與所屬系辦公告為準。</p><p>請勿輸入學號、密碼或其他敏感個資；資料預設僅暫存在本機瀏覽器。</p></footer>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>

</html>
